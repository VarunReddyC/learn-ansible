- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: "Linux, Shell, Ansible, Terraform, Docker"
    names:
    - Varunkumar
    - Reddy
    - C
    topic: ANIBLE 
  tasks:
  - name: print the name 
    debug:
      msg: "Hi , {{ person_name | default ('Varun')}}"

  - name: converst string to list 
    debug:
      msg: "Topics are: {{  topics | split(',') | trim }}"

  - name: convert list to string 
    debug: 
      msg: "Full Name: {{ names | join (' ')}}"
  - name: convert string to lower case
    debug: 
     msg: "Lower Case Topic: {{ topic | lower }}"