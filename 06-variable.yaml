- name: demo on task level variables
  hosts: local
  connection: local
  vars:
    property: 100 acers
  tasks:
  - name: print the vars
    debug: 
      msg: "I got property of {{property}} from my father"

  - name: print the vars again
    vars:
      property: 10 acers
    debug:
      msg: "Hi got property of {{property}} from my father"
