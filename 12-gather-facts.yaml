- name: print facts
  hosts: local
  connection: local
  tasks:
  - name: print the facts
    debug:
      msg: "{{ansible_facts}}"

  - name: print some informatin
    debug:
      msg: |
        OS Family: {{ansible_facts['os_family']}}
        Private_IP: {{ansible_facts.dfault_ipv4.address}}
        private_IP: {{ansible_facts['dfault_ipv4']['address']}}