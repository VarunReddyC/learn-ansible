- name: even or odd
  hosts: local
  connection: local
  vars:
    give_number: 10
  tasks:
  - name: is even 
    debug:
      msg: "Given number: {{give_number}} is even"
    when: give_number % 2 == 0 # expression 

  - name: is odd
    debug:
      msg: "Given number: {{give_number}} is odd"
    when: give_number % 2  !== 0 