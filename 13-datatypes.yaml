- name: course informatin
  hosts: local
  connection: local
  vars:
    course: "AIOps with DevSecOPs on AWS"  #String 
    duration_in_hrs: 150 # number
    is_live_session: true # boolean
    topics: #list
    - linux
    - Shell
    - ansible
    - Terraform 
    more_details: #dictionary/map
      trainer: varun
      months: 4
    exact_duration_month: 4.5

  tasks: 
  - name: print info and type 
    debug:
      msg: |
        name: "{{course}} :{{course | type_debug}}
        duration: "{{duration}} : {{duration | type_debug }}"
        is live: "{{ is_live_session}}: {{is_live_session | type_debug}}"
        topics are: "{{topics}} : {{topics | type_debug}}"
        more details: "{{more_details}} : {{more_details | type_debug}}"
        duration: "{{ exact_duration_month}} : {{exact_duration_month | type_debug}}""
        