- name: variables from file
  hosts: local
  connection: local
  vars:
    course: "ansible FROM PLAY"
  vars_prompt:
  - name: course
    prompt: Please enter your course
  vars_files: 
    course.yaml
  tasks:
  - name: print course informatin 
    vars:
      course: "ansible from task"
    debug: 
      msg: " I am learning {{course}} "

  